version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spring-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  frontend:
    image: nginx:1.25-alpine
    container_name: spring-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
