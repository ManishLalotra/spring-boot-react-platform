name: Spring Boot CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate POM and Architecture
        run: |
          test -f backend/pom.xml
          test -f backend/src/main/resources/application.yml
          echo "Spring Boot configuration validated."
